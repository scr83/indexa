<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The nav mark on a petrol tile. A tile rather than a bare glyph because a
       favicon is rendered at 16px against both light and dark browser chrome,
       and the bars alone disappear against dark. -->
  <rect width="32" height="32" fill="#102A2E"/>
  <rect x="5" y="19" width="5" height="8" fill="#8FB6A4"/>
  <rect x="13" y="14" width="5" height="13" fill="#DDA34A"/>
  <rect x="21" y="8" width="5" height="19" fill="#DDA34A"/>
  <circle cx="23.5" cy="4.2" r="3" fill="#EBB463"/>
</svg>
